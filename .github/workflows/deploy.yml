# Publishes the site to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # config.js is gitignored, so it is written here from repository secrets.
      # Add SUPABASE_URL and SUPABASE_ANON_KEY under
      # Settings → Secrets and variables → Actions.
      - name: Write config.js from secrets
        run: |
          cat > config.js <<CONFIG
          window.TRIP_CONFIG = {
            supabaseUrl:     '${{ secrets.SUPABASE_URL }}',
            supabaseAnonKey: '${{ secrets.SUPABASE_ANON_KEY }}',
            mapStyle: 'https://tiles.openfreemap.org/styles/positron'
          };
          CONFIG

      # Pages serves index.html with a short cache but app.js/styles.css stick
      # around in the browser, so a deploy can leave new markup driving old
      # code — buttons that render but do nothing. Stamping the commit SHA
      # onto the asset URLs makes every deploy a fresh URL. Matters most on
      # iOS Safari, where force-refreshing is awkward.
      - name: Cache-bust asset URLs
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=$V\"|" index.html
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$V\"|" index.html
          grep -E 'styles\.css|app\.js' index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
