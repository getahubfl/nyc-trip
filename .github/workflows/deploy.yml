# Publishes the site to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # config.js is gitignored, so it is written here from repository secrets.
      # Add SUPABASE_URL and SUPABASE_ANON_KEY under
      # Settings → Secrets and variables → Actions.
      - name: Write config.js from secrets
        run: |
          cat > config.js <<CONFIG
          window.TRIP_CONFIG = {
            supabaseUrl:     '${{ secrets.SUPABASE_URL }}',
            supabaseAnonKey: '${{ secrets.SUPABASE_ANON_KEY }}',
            mapStyle: 'https://tiles.openfreemap.org/styles/positron'
          };
          CONFIG

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
