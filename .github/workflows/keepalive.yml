# Supabase pauses free-tier projects after 7 days with no requests, and the
# first request after a pause takes 10-30 seconds to cold-start. This pings
# the project every 3 days so the trip app is never asleep when you open it.
name: Supabase keepalive

on:
  schedule:
    # Daily, not every 3 days. Supabase pauses a free project after 7 days
    # idle, and '*/3' on day-of-month restarts at the 1st — so the 28th to the
    # 1st is a 4-day gap. GitHub also silently skips scheduled runs on repos
    # with no recent activity, which stretches any gap further. The project
    # paused on 13 Oct 2026 despite this workflow reporting success on the
    # 10th. A daily ping costs nothing and removes the whole class of problem.
    - cron: '0 9 * * *'   # 09:00 UTC, daily
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          set -e
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
              "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat?select=ok&limit=1") || true
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then echo "awake"; exit 0; fi
            sleep 20
          done
          echo "Supabase did not respond with 200 after 3 attempts."
          cat /tmp/out || true
          exit 1
