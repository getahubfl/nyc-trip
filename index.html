<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New York — Thanksgiving 2026</title>
<meta name="theme-color" content="#0B0B0B">

<!-- Home Screen app. Added from Safari's Share menu, the page opens full
     screen under its own icon, with its own saved sign-in. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="New York">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body>

<!-- ============ sign-in gate ============ -->
<section class="gate" id="gate" hidden>
  <div class="gate-card">
    <h1 class="mast-title"><span>THANKSGIVING</span>New York</h1>
    <p class="gate-sub">Nov 25 – 28, 2026</p>
    <p class="gate-msg" id="gateMsg" role="status"></p>
    <form id="gateForm">
      <div class="f" id="gateEmailRow">
        <label for="gateEmail">EMAIL</label>
        <input id="gateEmail" type="email" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="you@example.com">
      </div>
      <div class="f">
        <label for="gatePass">TRIP PASSWORD</label>
        <input id="gatePass" type="password" required autocomplete="current-password">
        <div class="hint" id="gatePassHint">The password set for this trip, not the one for your email.</div>
      </div>
      <button class="btn primary" id="gateSignIn" type="submit">Sign in</button>
      <button class="addlink" id="gateUseCode" type="button">Forgot it? Email a code</button>
    </form>
    <form id="gateCodeForm" hidden>
      <button class="btn ghost" id="gateSend" type="button">Email me a code</button>
      <div class="f">
        <label for="gateCode">CODE FROM THE EMAIL</label>
        <input id="gateCode" type="text" inputmode="numeric" autocomplete="one-time-code" required placeholder="123456">
        <div class="hint">It is in the email from Supabase Auth, which Gmail may file under Updates.</div>
      </div>
      <button class="btn primary" id="gateVerify" type="submit">Sign in</button>
      <button class="addlink" id="gateRestart" type="button">Back to the password</button>
    </form>
  </div>
</section>

<!-- ============ app ============ -->
<div id="app" hidden>
<div class="shell">
  <div class="chrome" id="chrome">
  <header class="masthead">
    <div class="mast-row">
      <h1 class="mast-title"><span>THANKSGIVING</span>New York</h1>
      <div style="display:flex;align-items:flex-end;gap:10px">
        <div class="mast-meta"><b id="mastCount">—</b>Nov 25 – 28, 2026</div>
        <div class="menu">
          <button class="mast-menu" id="menuBtn" aria-label="More options" aria-expanded="false">⋯</button>
          <div class="menu-pop" id="menuPop" hidden>
            <button data-act="fit">Fit map to stops</button>
            <button data-act="relocate">Re-locate missing pins</button>
            <button data-act="password">Trip password</button>
            <button data-act="signout">Sign out</button>
          </div>
        </div>
      </div>
    </div>
    <span class="sync" id="sync" title="Live"></span>
  </header>

  <nav class="rail" id="rail" role="tablist" aria-label="Trip days"></nav>

  <div class="toolbar">
    <button class="filterbtn" id="filterBtn" aria-expanded="false" aria-controls="filterPanel">
      <i class="fbars" aria-hidden="true"></i>Filter <b id="filterN">All</b>
    </button>
    <button class="tobook" id="tobook" aria-pressed="false">To book <b id="tobookN">0</b></button>
    <button class="budget" id="budget">Budget <b id="budgetN">$0</b></button>
  </div>
  <div class="filterpanel" id="filterPanel" hidden>
    <div class="chips" id="chips"></div>
    <div class="filteracts">
      <button data-catall="1">Select all</button>
      <button data-catnone="1">Clear</button>
    </div>
  </div>
  </div>

  <div class="body-grid">
    <div class="map-col">
      <div class="map-wrap" id="mapWrap">
        <div id="map"></div>
        <div class="map-empty" id="mapEmpty" hidden></div>
        <div class="legkey" id="legKey" hidden>
          <span><svg viewBox="0 0 26 8" aria-hidden="true"><line x1="1" y1="4" x2="25" y2="4" stroke="#111" stroke-width="2.4" stroke-dasharray="1 4" stroke-linecap="round"/></svg>Walk</span>
          <span><svg viewBox="0 0 26 8" aria-hidden="true"><line x1="1" y1="4" x2="25" y2="4" stroke="#6B5B00" stroke-width="4"/><line x1="1" y1="4" x2="25" y2="4" stroke="#FCCC0A" stroke-width="2.2"/></svg>Car</span>
          <span><svg viewBox="0 0 26 8" aria-hidden="true"><line x1="1" y1="4" x2="25" y2="4" stroke="#0A62C9" stroke-width="2.4"/></svg>Subway</span>
          <span><svg viewBox="0 0 26 8" aria-hidden="true"><line x1="1" y1="4" x2="25" y2="4" stroke="#0A62C9" stroke-width="2.4" stroke-dasharray="1 4" stroke-linecap="round"/></svg>Walk to the train</span>
          <button id="legKeyClose" aria-label="Back to the day's route">×</button>
        </div>
      </div>
    </div>
    <div class="list-col">
      <div class="list" id="list"></div>
    </div>
  </div>
</div>

<button class="fab" id="fab">+ New stop</button>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head"><h2 id="sheetTitle">—</h2><button id="closeSheet" aria-label="Close">×</button></div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot"></div>
</section>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
